server_tokens off;

# Avoid recording OAuth authorization codes and state values from query strings.
log_format redacted '$remote_addr [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    'user_agent="$http_user_agent" request_id=$request_id';
access_log /dev/stdout redacted;
error_log /dev/stderr warn;

limit_req_status 429;
limit_conn_status 429;
limit_req_zone $binary_remote_addr zone=general_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mcp_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
