<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#16325C" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7091"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #16233A; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #5C6B82; }
      .lane-title { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .step-title { font-size: 15px; font-weight: 700; }
      .step-copy { font-size: 12px; fill: #586981; }
      .note { font-size: 13px; fill: #5C6B82; }
    </style>
  </defs>

  <rect width="1400" height="980" rx="28" fill="url(#bg)"/>
  <text x="70" y="62" class="title">Xero MCP 主要业务流程</text>
  <text x="70" y="94" class="subtitle">共享应用接入 → 独立账套连接 → 读取与分析 → 材料准备 → 人工确认后的受控写入</text>

  <!-- Lane 1 -->
  <g filter="url(#shadow)"><rect x="70" y="130" width="1260" height="140" rx="18" fill="#FFFFFF" stroke="#CAD7EA"/></g>
  <rect x="70" y="130" width="170" height="140" rx="18" fill="#315DA8"/>
  <text x="96" y="183" class="lane-title">1. 连接与读取</text>
  <text x="96" y="210" font-size="13" style="fill:#DDE9FF">每人独立授权</text>
  <g>
    <rect x="270" y="160" width="190" height="78" rx="12" fill="#EEF4FF"/>
    <text x="287" y="187" class="step-title">共享 Work MCP 应用</text>
    <text x="287" y="210" class="step-copy">Client ID / Secret 配置一次</text>
    <rect x="490" y="160" width="190" height="78" rx="12" fill="#EEF4FF"/>
    <text x="507" y="187" class="step-title">用户点击 Connect</text>
    <text x="507" y="210" class="step-copy">生成独立 installation</text>
    <rect x="710" y="160" width="190" height="78" rx="12" fill="#E7FAFA"/>
    <text x="727" y="187" class="step-title">Xero OAuth</text>
    <text x="727" y="210" class="step-copy">选择自己的 Organisation</text>
    <rect x="930" y="160" width="170" height="78" rx="12" fill="#F0F6FF"/>
    <text x="947" y="187" class="step-title">隔离保存</text>
    <text x="947" y="210" class="step-copy">token family + binding</text>
    <rect x="1130" y="160" width="170" height="78" rx="12" fill="#F3F8F4"/>
    <text x="1147" y="187" class="step-title">读取 Xero</text>
    <text x="1147" y="210" class="step-copy">账套 / 币种 / 历史数据</text>
  </g>
  <g stroke="#5B7091" stroke-width="2" marker-end="url(#arrow)">
    <line x1="460" y1="199" x2="482" y2="199"/><line x1="680" y1="199" x2="702" y2="199"/><line x1="900" y1="199" x2="922" y2="199"/><line x1="1100" y1="199" x2="1122" y2="199"/>
  </g>

  <!-- Lane 2 -->
  <g filter="url(#shadow)"><rect x="70" y="295" width="1260" height="130" rx="18" fill="#FFFFFF" stroke="#CAD7EA"/></g>
  <rect x="70" y="295" width="170" height="130" rx="18" fill="#3D6B87"/>
  <text x="96" y="345" class="lane-title">2. 分析与检查</text>
  <text x="96" y="372" font-size="13" style="fill:#DCECF4">先读后判断</text>
  <g>
    <rect x="300" y="322" width="230" height="76" rx="12" fill="#F1F7FA"/>
    <text x="319" y="350" class="step-title">获取原始会计数据</text><text x="319" y="374" class="step-copy">账户、交易、余额与历史记录</text>
    <rect x="585" y="322" width="230" height="76" rx="12" fill="#F1F7FA"/>
    <text x="604" y="350" class="step-title">识别异常与待办</text><text x="604" y="374" class="step-copy">缺失、重复、未匹配与风险项</text>
    <rect x="870" y="322" width="230" height="76" rx="12" fill="#F1F7FA"/>
    <text x="889" y="350" class="step-title">给出可核对结论</text><text x="889" y="374" class="step-copy">引用来源，不把建议冒充入账</text>
  </g>
  <g stroke="#5B7091" stroke-width="2" marker-end="url(#arrow)"><line x1="530" y1="360" x2="577" y2="360"/><line x1="815" y1="360" x2="862" y2="360"/></g>

  <!-- Lane 3 -->
  <g filter="url(#shadow)"><rect x="70" y="450" width="1260" height="130" rx="18" fill="#FFFFFF" stroke="#CAD7EA"/></g>
  <rect x="70" y="450" width="170" height="130" rx="18" fill="#7664A8"/>
  <text x="96" y="500" class="lane-title">3. 材料准备</text>
  <text x="96" y="527" font-size="13" style="fill:#ECE7FA">不直接入账</text>
  <g>
    <rect x="300" y="477" width="230" height="76" rx="12" fill="#F5F2FB"/>
    <text x="319" y="505" class="step-title">接收业务材料</text><text x="319" y="529" class="step-copy">发票、收据、说明或结构化表格</text>
    <rect x="585" y="477" width="230" height="76" rx="12" fill="#F5F2FB"/>
    <text x="604" y="505" class="step-title">生成平衡分录草案</text><text x="604" y="529" class="step-copy">借贷相等、字段完整、来源可追溯</text>
    <rect x="870" y="477" width="230" height="76" rx="12" fill="#FFF7E5"/>
    <text x="889" y="505" class="step-title">等待人工审批</text><text x="889" y="529" class="step-copy">未确认前保持 PREPARED</text>
  </g>
  <g stroke="#5B7091" stroke-width="2" marker-end="url(#arrow)"><line x1="530" y1="515" x2="577" y2="515"/><line x1="815" y1="515" x2="862" y2="515"/></g>

  <!-- Lane 4 -->
  <g filter="url(#shadow)"><rect x="70" y="605" width="1260" height="130" rx="18" fill="#FFFFFF" stroke="#CAD7EA"/></g>
  <rect x="70" y="605" width="170" height="130" rx="18" fill="#267969"/>
  <text x="96" y="655" class="lane-title">4. 受控写入</text>
  <text x="96" y="682" font-size="13" style="fill:#DCF2ED">确认后才执行</text>
  <g>
    <rect x="277" y="632" width="190" height="76" rx="12" fill="#EDF8F5"/>
    <text x="294" y="660" class="step-title">人工明确确认</text><text x="294" y="684" class="step-copy">锁定内容与目标账套</text>
    <rect x="500" y="632" width="190" height="76" rx="12" fill="#EDF8F5"/>
    <text x="517" y="660" class="step-title">校验写入闸门</text><text x="517" y="684" class="step-copy">revision / 幂等 / 权限</text>
    <rect x="723" y="632" width="190" height="76" rx="12" fill="#E7FAFA"/>
    <text x="740" y="660" class="step-title">写入 Xero</text><text x="740" y="684" class="step-copy">由 Xero 返回正式记录 ID</text>
    <rect x="946" y="632" width="190" height="76" rx="12" fill="#EDF8F5"/>
    <text x="963" y="660" class="step-title">回读与审计</text><text x="963" y="684" class="step-copy">receipt + exact read-back</text>
  </g>
  <g stroke="#5B7091" stroke-width="2" marker-end="url(#arrow)"><line x1="467" y1="670" x2="492" y2="670"/><line x1="690" y1="670" x2="715" y2="670"/><line x1="913" y1="670" x2="938" y2="670"/></g>

  <!-- Lane 5 -->
  <g filter="url(#shadow)"><rect x="70" y="760" width="1260" height="130" rx="18" fill="#FFFFFF" stroke="#CAD7EA"/></g>
  <rect x="70" y="760" width="170" height="130" rx="18" fill="#A36B22"/>
  <text x="96" y="810" class="lane-title">5. 切换账套</text>
  <text x="96" y="837" font-size="13" style="fill:#FFF0D5">显式选择再生效</text>
  <g>
    <rect x="277" y="787" width="190" height="76" rx="12" fill="#FFF7E8"/>
    <text x="294" y="815" class="step-title">用户要求切换</text><text x="294" y="839" class="step-copy">生成一次性选择链接</text>
    <rect x="500" y="787" width="190" height="76" rx="12" fill="#FFF7E8"/>
    <text x="517" y="815" class="step-title">明确选择 Organisation</text><text x="517" y="839" class="step-copy">不靠猜测或静默切换</text>
    <rect x="723" y="787" width="190" height="76" rx="12" fill="#FFF7E8"/>
    <text x="740" y="815" class="step-title">更新 binding revision</text><text x="740" y="839" class="step-copy">旧 proposal 自动失效</text>
    <rect x="946" y="787" width="190" height="76" rx="12" fill="#F3F8F4"/>
    <text x="963" y="815" class="step-title">重新读取核验</text><text x="963" y="839" class="step-copy">Organisation + currency</text>
  </g>
  <g stroke="#5B7091" stroke-width="2" marker-end="url(#arrow)"><line x1="467" y1="825" x2="492" y2="825"/><line x1="690" y1="825" x2="715" y2="825"/><line x1="913" y1="825" x2="938" y2="825"/></g>

  <rect x="170" y="915" width="1060" height="42" rx="12" fill="#162F55"/>
  <text x="195" y="941" font-size="14" style="fill:#FFFFFF">控制原则：OAuth 成功不等于写入完成；只有正式记录 ID、写入回执与精确回读全部成立，才可称为已入账。</text>
</svg>
