<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16325C" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B6386"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #16233A; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #5C6B82; }
      .box-title { font-size: 21px; font-weight: 700; }
      .box-copy { font-size: 15px; fill: #43536B; }
      .small { font-size: 13px; fill: #5C6B82; }
      .arrow-label { font-size: 13px; font-weight: 600; fill: #36527A; }
      .chip { font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="70" y="62" class="title">Xero MCP 整体架构</text>
  <text x="70" y="94" class="subtitle">共享一套 Work 应用凭证；每位测试者的 installation、Xero 授权与账套绑定独立隔离</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="230" height="310" rx="20" fill="#FFFFFF" stroke="#CAD7EA"/>
    <rect x="340" y="145" width="260" height="310" rx="20" fill="#FFFFFF" stroke="#9FC0FF"/>
    <rect x="650" y="125" width="350" height="350" rx="22" fill="#FFFFFF" stroke="#729EFF" stroke-width="2"/>
    <rect x="1050" y="145" width="280" height="310" rx="20" fill="#FFFFFF" stroke="#8BCFD2"/>
  </g>

  <text x="95" y="182" class="box-title">早期测试用户</text>
  <g>
    <circle cx="114" cy="228" r="20" fill="#E8F0FF"/><text x="108" y="234" font-size="16" font-weight="700">A</text>
    <text x="145" y="233" class="box-copy">测试者 A</text>
    <circle cx="114" cy="282" r="20" fill="#E8F0FF"/><text x="108" y="288" font-size="16" font-weight="700">B</text>
    <text x="145" y="287" class="box-copy">测试者 B</text>
    <circle cx="114" cy="336" r="20" fill="#E8F0FF"/><text x="108" y="342" font-size="16" font-weight="700">C</text>
    <text x="145" y="341" class="box-copy">测试者 C …</text>
  </g>
  <rect x="94" y="385" width="182" height="40" rx="10" fill="#F2F6FC"/>
  <text x="108" y="410" class="chip" fill="#48617F">每人分别点击 Connect</text>

  <text x="365" y="182" class="box-title">Work MCP 应用</text>
  <rect x="365" y="207" width="210" height="43" rx="11" fill="#EAF1FF"/>
  <text x="382" y="234" class="chip" fill="#315DA8">共享 Client ID + Secret</text>
  <text x="365" y="282" class="box-copy">Redirect URI 配置一次</text>
  <text x="365" y="314" class="box-copy">凭证标识同一个 MCP 应用</text>
  <text x="365" y="346" class="box-copy">不等于某个测试者本人</text>
  <rect x="365" y="378" width="210" height="50" rx="11" fill="#FFF7E5" stroke="#F0C56D"/>
  <text x="382" y="399" class="small">适用范围</text>
  <text x="382" y="418" class="chip" fill="#8B5E00">5–10 人早期 UAT</text>

  <text x="677" y="166" class="box-title">Xero Accounting MCP</text>
  <text x="677" y="200" class="box-copy">OAuth Broker 创建独立 installation</text>
  <g>
    <rect x="678" y="223" width="294" height="54" rx="12" fill="#EEF4FF"/>
    <text x="696" y="245" class="chip" fill="#315DA8">Installation A</text>
    <text x="696" y="264" class="small">token family A · binding A</text>
    <rect x="678" y="290" width="294" height="54" rx="12" fill="#EEF4FF"/>
    <text x="696" y="312" class="chip" fill="#315DA8">Installation B</text>
    <text x="696" y="331" class="small">token family B · binding B</text>
    <rect x="678" y="357" width="294" height="54" rx="12" fill="#EEF4FF"/>
    <text x="696" y="379" class="chip" fill="#315DA8">Installation C …</text>
    <text x="696" y="398" class="small">互不覆盖，可独立撤销或切换账套</text>
  </g>
  <text x="678" y="444" class="small">工具权限 · 写入闸门 · 幂等 · 回读 · 审计</text>

  <text x="1075" y="182" class="box-title">Xero</text>
  <rect x="1075" y="207" width="230" height="54" rx="12" fill="#E7FAFA"/>
  <text x="1092" y="230" class="chip" fill="#167278">每位用户独立授权</text>
  <text x="1092" y="249" class="small">选择自己的 Organisation</text>
  <text x="1075" y="299" class="box-copy">账套、科目、凭证、报表</text>
  <text x="1075" y="331" class="box-copy">Xero 是正式会计记录系统</text>
  <text x="1075" y="363" class="box-copy">MCP 不另建一套账本</text>
  <rect x="1075" y="389" width="230" height="40" rx="10" fill="#F1FBFB"/>
  <text x="1092" y="414" class="chip" fill="#167278">正式数据仍留在 Xero</text>

  <line x1="300" y1="300" x2="334" y2="300" stroke="#4B6386" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="300" x2="642" y2="300" stroke="#4B6386" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="606" y="283" class="arrow-label">外层 OAuth</text>
  <line x1="1000" y1="300" x2="1042" y2="300" stroke="#4B6386" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1007" y="283" class="arrow-label">Xero OAuth</text>

  <g filter="url(#shadow)">
    <rect x="170" y="520" width="1060" height="90" rx="18" fill="#162F55"/>
  </g>
  <text x="198" y="552" font-size="19" font-weight="700" style="fill:#FFFFFF">PostgreSQL 状态与审计层</text>
  <text x="198" y="580" font-size="14" style="fill:#DCE8FA">installation · access/refresh token family · 当前 Organisation binding · revision · proposal · receipt · audit event</text>
  <rect x="198" y="625" width="1004" height="52" rx="14" fill="#FFF7E5" stroke="#E7B957"/>
  <text x="218" y="648" class="chip" fill="#7A5200">早期 UAT 边界：</text>
  <text x="342" y="648" class="box-copy">installation subject 由服务端生成；正式产品需由 Work 提供可验证的 user / workspace / installation identity。</text>
  <text x="218" y="668" class="small">这不会影响多人测试隔离，但不能替代生产级真实用户身份与租户审计。</text>
</svg>
